[package]
name = "muse"
version = "0.1.0"
edition = "2021"
description = "Muse — AI-native media curation & taste companion (Phase 0 scaffold)"
license = "MIT"

[[bin]]
name = "muse"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "ipnetwork",
] }
ipnetwork = { version = "0.20", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
pgvector = { version = "=0.4.1", features = ["sqlx"] }
# MUSE-29: `stream!` used to chain per-program ffmpeg child-process stdout
# into the `/auto/v{channel_id}` HTTP response body.
async-stream = "0.3"
# MUSET-03: SHA-256 checksums for snapshot-ingestion provenance records
# (src/snapshot/provenance.rs) -- a well-established, pure-Rust hashing
# crate, no new runtime surface (no network, no FFI).
sha2 = "0.10"
# PROMEX-03: application-level Prometheus metrics exporter (see
# src/metrics.rs). Same version pin as the reference pattern merged in
# Terminus (PROMEX-01) and Chord (PROMEX-02).
prometheus = "0.13"
# MUSEL-C2: base64-encodes still-frame JPEG bytes into the OpenAI-compatible
# `data:image/jpeg;base64,...` image_url payload Chord's vision endpoint
# expects (src/taste_model/chord_client.rs `chat_completion_with_image`).
# Encoding only -- not an image/JPEG decoder (see src/matching/liveness.rs
# for why a decode dependency was deliberately avoided).
base64 = "0.22"
# MUSEL-C2 (review: codex): the still-liveness check (src/matching/
# liveness.rs) decodes each sample still to real luma pixels before
# computing mean/variance/dominant-value stats. An earlier byte-level
# proxy over the still's *compressed* bytes (no decode) was tried first
# to avoid this dependency, but was PROVEN not to discriminate: JPEG's
# entropy coding makes the compressed byte stream look statistically
# noisy/varied even for a genuinely solid-black frame (see the module doc
# comment for the measured evidence), so liveness needs the real pixels.
# `jpeg` feature only -- no other format decoders.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# MUSEF-02: `flock(2)` for the Foundry swap lock (src/foundry/forge.rs).
# `std` exposes no advisory file locking, and the swap needs one to serialize
# concurrent Muse workers against the same library file.
#
# This adds NO new supply-chain surface: libc 0.2 was already in Cargo.lock as
# a transitive dependency (tokio et al) and is already linked into the binary —
# this only makes the existing dependency direct. The alternative considered
# and rejected was a hand-written `extern "C" { fn flock(...) }` block, which
# avoids the manifest line but is less reviewable for exactly the same
# underlying call.
libc = "0.2"

[dev-dependencies]
httpmock = "0.7"
tokio-test = "0.4"
serial_test = "3"
# MUSET-01: the endpoint test harness drives the real axum Router via
# `ServiceExt::oneshot`, which is feature-gated behind tower's `util` feature.
tower = { version = "0.4", features = ["util"] }
