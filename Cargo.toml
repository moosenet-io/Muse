[package]
name = "muse"
version = "0.1.0"
edition = "2021"
description = "Muse — AI-native media curation & taste companion (Phase 0 scaffold)"
license = "MIT"

[[bin]]
name = "muse"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "ipnetwork",
] }
ipnetwork = { version = "0.20", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
pgvector = { version = "=0.4.1", features = ["sqlx"] }
# MUSE-29: `stream!` used to chain per-program ffmpeg child-process stdout
# into the `/auto/v{channel_id}` HTTP response body.
async-stream = "0.3"
# MUSET-03: SHA-256 checksums for snapshot-ingestion provenance records
# (src/snapshot/provenance.rs) -- a well-established, pure-Rust hashing
# crate, no new runtime surface (no network, no FFI).
sha2 = "0.10"

[dev-dependencies]
httpmock = "0.7"
tokio-test = "0.4"
serial_test = "3"
# MUSET-01: the endpoint test harness drives the real axum Router via
# `ServiceExt::oneshot`, which is feature-gated behind tower's `util` feature.
tower = { version = "0.4", features = ["util"] }
